[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "pushquantum"
version = "0.1.0"
description = "Minimal template for neutral-atom circuit compilation with a custom AOD `move` instruction."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "matplotlib>=3.11.2",
    "networkx>=3.6.1",
    "ortools>=9.15.6755",
    "pyarrow>=26.0.1",
    "pytest>=9.2.0",
    "qiskit>=1.3",
    "qiskit-aer>=0.18.4",
    "scipy>=1.17.1",
]

[dependency-groups]
dev = [
    "mqt-qcec>=3.12.0",
    "ruff>=0.11",
]

[tool.hatch.build.targets.wheel]
packages = ["src/pushquantum"]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF"]
isort.required-imports = ["from __future__ import annotations"]
